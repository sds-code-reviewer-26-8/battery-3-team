<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼삼오오 발표 자료</title>
<style>
:root {
	--bg: #0d0c24;
	--card: #1d1b45;
	--card2: #26235a;
	--panel: rgba(255, 255, 255, .06);
	--line: rgba(255, 255, 255, .14);
	--ink: #f3f2ff;
	--muted: #b6b4dc;
	--dim: #8d8bb8;
	--accent: #8f89ff;
	--accent2: #5eead4;
	--gold: #fbbf24;
	--green: #34d399;
	--orange: #fb923c;
	--pink: #f472b6;
	--font: "Pretendard Variable", Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #07061a; color: var(--ink); font-family: var(--font); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }

#viewport { position: fixed; inset: 0; }
#stage {
	position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden;
	transform-origin: center center; background: var(--bg);
}

/* ---------- 배경 ---------- */
.bg { position: absolute; inset: 0; pointer-events: none; }
.bg i { position: absolute; border-radius: 50%; will-change: transform; }
.bg .b1 { width: 1100px; height: 1100px; left: -300px; top: -420px; background: radial-gradient(circle, rgba(143, 137, 255, .38), transparent 65%); animation: drift1 26s ease-in-out infinite alternate; }
.bg .b2 { width: 1000px; height: 1000px; right: -280px; bottom: -420px; background: radial-gradient(circle, rgba(94, 234, 212, .20), transparent 65%); animation: drift2 32s ease-in-out infinite alternate; }
.bg .b3 { width: 700px; height: 700px; right: 260px; top: -300px; background: radial-gradient(circle, rgba(244, 114, 182, .16), transparent 65%); animation: drift1 38s ease-in-out infinite alternate-reverse; }
.bg .grid { inset: 0; border-radius: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 64px 64px; -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%); mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%); }
@keyframes drift1 { to { transform: translate(140px, 90px) scale(1.1); } }
@keyframes drift2 { to { transform: translate(-160px, -80px) scale(1.12); } }

/* ---------- 슬라이드 ---------- */
.slide {
	position: absolute; inset: 0; padding: 56px 96px 96px; opacity: 0; visibility: hidden;
	transform: translateX(60px); transition: opacity .5s ease, transform .5s ease, visibility 0s linear .5s;
}
.slide.active { opacity: 1; visibility: visible; transform: none; transition: opacity .5s ease, transform .5s ease; }
.slide.past { transform: translateX(-60px); }

.head { height: 150px; }
.kicker { display: inline-flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 700; color: var(--accent2); letter-spacing: .02em; }
.kicker b { display: inline-block; padding: 4px 14px; border-radius: 999px; background: rgba(94, 234, 212, .14); border: 1px solid rgba(94, 234, 212, .35); font-weight: 700; }
.kicker span { color: var(--muted); font-weight: 500; }
h1.title { font-size: 66px; font-weight: 800; line-height: 1.12; margin-top: 12px; letter-spacing: -.01em; background: linear-gradient(90deg, #fff 30%, #c7c4ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { font-size: 25px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
.body { position: relative; height: 780px; }
.head.tall { height: 212px; }
.body.short { height: 730px; }

/* ---------- 조각(클릭마다 나타남) ---------- */
.frag { opacity: 0; transform: translateY(26px) scale(.985); pointer-events: none; transition: opacity .45s ease, transform .45s cubic-bezier(.2, .8, .2, 1); }
.frag.shown { opacity: 1; transform: none; pointer-events: auto; }
.frag.swapped { opacity: 0; visibility: hidden; transform: translateY(-20px); pointer-events: none; }
.swapbox { position: relative; }
.swapbox > .frag { position: absolute; inset: 0; }

/* ---------- 공통 부품 ---------- */
.glass { background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.04)); border: 1px solid var(--line); border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,.28); }
.ava { border-radius: 50%; object-fit: cover; display: block; background: #eee; }
.ring { padding: 6px; border-radius: 50%; background: conic-gradient(from 200deg, #8f89ff, #5eead4, #f472b6, #8f89ff); box-shadow: 0 0 60px rgba(143, 137, 255, .45); display: inline-block; }
.ring .ava { border: 5px solid var(--bg); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 999px; font-size: 22px; font-weight: 700; background: rgba(255,255,255,.10); border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.pill.gold { background: rgba(251, 191, 36, .16); border-color: rgba(251, 191, 36, .5); color: var(--gold); }
.pill.green { background: rgba(52, 211, 153, .15); border-color: rgba(52, 211, 153, .45); color: var(--green); }
.pill.orange { background: rgba(251, 146, 60, .15); border-color: rgba(251, 146, 60, .45); color: var(--orange); }
.pill.teal { background: rgba(94, 234, 212, .14); border-color: rgba(94, 234, 212, .4); color: var(--accent2); }
.pill.purple { background: rgba(143, 137, 255, .2); border-color: rgba(143, 137, 255, .55); color: #cfccff; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 10px 22px; border-radius: 14px; font-size: 21px; font-weight: 700; text-decoration: none; background: rgba(143, 137, 255, .22); border: 1px solid rgba(143, 137, 255, .6); color: #e4e2ff; transition: background .2s, transform .2s; }
.btn:hover { background: rgba(143, 137, 255, .4); transform: translateY(-2px); }

/* ---------- 말풍선 ---------- */
.bubble { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 26px; padding: 24px 32px; box-shadow: 0 14px 34px rgba(0,0,0,.3); }
.bubble.tail::before { content: ""; position: absolute; left: -12px; top: 38px; width: 22px; height: 22px; background: var(--card); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); border-bottom-left-radius: 6px; }
.bubble.hl { background: linear-gradient(135deg, #5f59e6, #7f79f7); border-color: rgba(255,255,255,.28); }
.bubble.hl.tail::before { background: #6760ea; border-color: rgba(255,255,255,.28); }
.bubble h3 { font-size: 30px; font-weight: 800; line-height: 1.3; }
.bubble p { font-size: 24px; line-height: 1.55; color: var(--muted); margin-top: 8px; }
.bubble.hl p { color: #ece9ff; }
.num { flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0d0c24; }

/* ---------- 하단 크롬 ---------- */
.chrome { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; padding: 0 64px; display: flex; align-items: center; gap: 24px; z-index: 30; background: linear-gradient(to top, rgba(5,4,20,.85), rgba(5,4,20,0)); }
.chrome .brand { font-weight: 800; font-size: 22px; color: #fff; }
.chrome .sec { font-size: 20px; color: var(--dim); min-width: 190px; }
.chrome .progress { flex: 1; height: 6px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
.chrome .progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s ease; }
.chrome .count { font-size: 22px; font-weight: 700; color: var(--muted); min-width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
.chrome button { width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.08); font-size: 22px; line-height: 1; display: grid; place-items: center; transition: background .2s; }
.chrome button:hover { background: rgba(255,255,255,.2); }
.chrome button:focus-visible, .btn:focus-visible, .card-btn:focus-visible { outline: 3px solid var(--accent2); outline-offset: 3px; }

/* ---------- 표지 ---------- */
.cover { display: flex; flex-direction: column; justify-content: center; padding-top: 40px; }
.cover .eyebrow { font-size: 28px; font-weight: 700; color: var(--accent2); letter-spacing: .12em; text-transform: uppercase; }
.cover h1 { font-size: 230px; font-weight: 900; line-height: 1; letter-spacing: -.03em; margin: 8px 0 12px; background: linear-gradient(100deg, #fff 20%, #b9b5ff 60%, #5eead4); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cover .tagline { font-size: 36px; color: var(--muted); }
.team { display: flex; gap: 36px; margin-top: 64px; }
.member { width: 360px; padding: 34px 20px 28px; text-align: center; animation: float 6s ease-in-out infinite; }
.member:nth-child(2) { animation-delay: -1.5s; } .member:nth-child(3) { animation-delay: -3s; } .member:nth-child(4) { animation-delay: -4.5s; }
@keyframes float { 50% { transform: translateY(-12px); } }
.member .ava { width: 190px; height: 190px; margin: 0 auto; }
.member .nm { font-size: 40px; font-weight: 800; margin: 18px 0 10px; }
.member .gh { font-size: 20px; color: var(--dim); margin-top: 10px; }
.cover .links { position: absolute; right: 96px; top: 64px; display: flex; gap: 14px; }
.cover .hint { position: absolute; left: 96px; bottom: 100px; font-size: 22px; color: var(--dim); }

/* ---------- 테스트 ---------- */
.tests { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 24px; height: 100%; }
.tcard { padding: 28px 30px; display: flex; flex-direction: column; }
.tcard h4 { font-size: 28px; font-weight: 800; color: var(--muted); }
.tcard .big { font-size: 96px; font-weight: 900; line-height: 1.05; margin: 6px 0 10px; background: linear-gradient(120deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums; }
.tcard .big small { font-size: 36px; font-weight: 800; margin-left: 4px; }
.tcard p { font-size: 21px; line-height: 1.5; color: var(--muted); }
.tcard.hl { background: linear-gradient(135deg, #5f59e6, #7f79f7); border-color: rgba(255,255,255,.3); }
.tcard.hl h4, .tcard.hl p { color: #ece9ff; }
.tcard.hl .big { background: none; color: #fff; -webkit-text-fill-color: #fff; }

/* ---------- 브라우저 프레임 ---------- */
.frame { border-radius: 20px; overflow: hidden; background: #fff; border: 1px solid var(--line); box-shadow: 0 30px 70px rgba(0,0,0,.5); display: inline-block; }
.frame .bar { height: 40px; background: #e9e8f7; display: flex; align-items: center; gap: 9px; padding: 0 16px; }
.frame .bar i { width: 13px; height: 13px; border-radius: 50%; background: #f26b6b; } .frame .bar i:nth-child(2) { background: #f5c04a; } .frame .bar i:nth-child(3) { background: #5cc98b; }
.frame .bar span { margin-left: 12px; flex: 1; height: 22px; border-radius: 11px; background: #fff; opacity: .8; }
.frame img { display: block; }
.zoomable { cursor: zoom-in; }

/* ---------- 템플릿 / 뼈대 ---------- */
.tpl { display: grid; grid-template-columns: auto 1fr; gap: 56px; height: 100%; }
.tpl .shots { display: flex; gap: 32px; }
.tpl .shot { text-align: center; }
.tpl .shot .tag { margin-bottom: 14px; }
.tpl .shot img { height: 650px; width: auto; }
.tpl .side { display: flex; flex-direction: column; gap: 22px; }
.note { padding: 22px 30px; }
.note h3 { font-size: 30px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
.note h3 .btn { margin-left: auto; padding: 6px 16px; font-size: 19px; }
.note p, .note li { font-size: 22px; line-height: 1.5; color: var(--muted); }
.note ul { list-style: none; display: grid; gap: 8px; }
.note li::before { content: "✓"; color: var(--accent2); font-weight: 900; margin-right: 12px; }
.note .row { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }

.flow { position: relative; height: 330px; }
.fnode { position: absolute; top: 60px; width: 280px; height: 132px; padding: 16px 18px; text-align: center; display: flex; flex-direction: column; justify-content: center; border-radius: 24px; }
.fnode b { font-size: 30px; font-weight: 800; } .fnode span { font-size: 20px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
.fnode.step { background: linear-gradient(135deg, #5f59e6, #7f79f7); border: 1px solid rgba(255,255,255,.3); box-shadow: 0 16px 40px rgba(95, 89, 230, .45); }
.fnode.step span { color: #ece9ff; }
.farrow { position: absolute; top: 108px; width: 82px; height: 36px; color: var(--accent2); font-size: 40px; font-weight: 900; text-align: center; line-height: 36px; }
.fhilp { position: absolute; top: 0; left: 362px; width: 280px; text-align: center; }
.fhilp::after { content: ""; display: block; width: 3px; height: 26px; margin: 4px auto 0; background: var(--orange); }
.fback { position: absolute; top: 192px; left: 502px; width: 724px; height: 62px; border: 3px dashed var(--accent2); border-top: none; border-radius: 0 0 28px 28px; }
.fback::before, .fback::after { content: ""; position: absolute; top: -14px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; }
.fback::before { left: -13px; border-bottom: 16px solid var(--accent2); }
.flabel { position: absolute; top: 262px; left: 502px; width: 724px; text-align: center; font-size: 23px; color: var(--accent2); font-weight: 700; }
.fcols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; height: 440px; }
.mini { padding: 16px 24px; margin-bottom: 14px; }
.mini h4 { font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
.mini p { font-size: 21px; line-height: 1.45; color: var(--muted); margin-top: 4px; }
.dec { display: grid; gap: 10px; }
.dec div { padding: 12px 22px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }
.dec b { display: block; font-size: 23px; font-weight: 800; }
.dec span { display: block; font-size: 20px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

/* ---------- 프로필 + 말풍선 (Best Practice) ---------- */
.bp { display: grid; grid-template-columns: 340px 1fr; gap: 56px; height: 100%; }
.profile { padding: 36px 24px; text-align: center; height: fit-content; }
.profile .ava { width: 230px; height: 230px; }
.profile .nm { font-size: 44px; font-weight: 800; margin: 24px 0 8px; }
.profile .cap { font-size: 22px; color: var(--muted); }
.profile .intro { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); display: grid; gap: 14px; justify-items: center; }
.profile .intro .ava { width: 84px; height: 84px; }
.profile .intro .t { font-size: 22px; color: var(--muted); line-height: 1.4; }
.chat { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 26px; }
.chat .bubble { flex: 1; }

/* ---------- 느낀 점 ---------- */
.feel { display: grid; grid-template-columns: 280px 660px 1fr; gap: 40px; height: 100%; }
.feel .profile { padding: 30px 18px; }
.feel .profile .ava { width: 190px; height: 190px; }
.feel .profile .nm { font-size: 38px; }
.fgroup { padding: 22px 28px; margin-bottom: 18px; }
.fgroup h4 { font-size: 26px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
.fgroup li { list-style: none; font-size: 22px; line-height: 1.5; color: var(--ink); padding-left: 22px; position: relative; margin-top: 8px; }
.fgroup li::before { content: ""; position: absolute; left: 0; top: .6em; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.fgroup.good li::before { background: var(--green); } .fgroup.bad li::before { background: var(--orange); }
.fgroup li b { color: #fff; }
.probhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.probhead h4 { font-size: 28px; font-weight: 800; }
.dots { display: flex; gap: 10px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.2); transition: background .3s, transform .3s; }
.dots i.on { background: var(--accent2); transform: scale(1.3); }
.pcard { padding: 26px 32px; overflow: auto; }
.pcard .tag { font-size: 20px; font-weight: 800; letter-spacing: .06em; margin-bottom: 4px; }
.pcard .tag.p { color: var(--orange); } .pcard .tag.c { color: var(--pink); } .pcard .tag.f { color: var(--green); }
.pcard p { font-size: 22px; line-height: 1.55; margin-bottom: 14px; }
.pcard p.f { color: #e8fff7; }
.pcard p.c { color: var(--muted); }

/* ---------- 미션 ---------- */
.mission { display: grid; grid-template-columns: auto 1fr; gap: 56px; height: 100%; align-items: start; }
.mission .frame img { height: 700px; width: auto; }
.mside { display: flex; flex-direction: column; gap: 28px; }
.who { padding: 34px 40px; }
.who .row { display: flex; align-items: center; gap: 22px; justify-content: space-between; }
.who .p { text-align: center; } .who .p .ava { width: 150px; height: 150px; margin: 0 auto 12px; } .who .p b { font-size: 34px; display: block; } .who .p span { font-size: 22px; color: var(--muted); }
.who .arrow { font-size: 44px; color: var(--accent2); font-weight: 900; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.stat { padding: 30px 34px; }
.stat .n { font-size: 88px; font-weight: 900; line-height: 1; background: linear-gradient(120deg, #fff, var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat .n small { font-size: 34px; margin-left: 4px; }
.stat .l { font-size: 24px; color: var(--muted); margin-top: 6px; }

/* ---------- PR 현황 ---------- */
.prtable { display: grid; gap: 18px; }
.prrow { display: grid; grid-template-columns: 330px 1fr 300px 320px; align-items: center; gap: 24px; padding: 22px 32px; }
.prrow .m b { font-size: 30px; font-weight: 800; display: block; } .prrow .m span { font-size: 21px; color: var(--muted); }
.prrow .ag { display: flex; align-items: center; gap: 18px; font-size: 24px; font-weight: 700; }
.prrow .ag .ava { width: 74px; height: 74px; } .prrow .ag small { display: block; font-size: 19px; color: var(--muted); font-weight: 500; }
.prrow .ag .ar { color: var(--accent2); font-size: 34px; font-weight: 900; }
.bar2 { height: 14px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 8px; }
.bar2 i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.prrow .nums { font-size: 22px; color: var(--muted); } .prrow .nums b { color: #fff; font-size: 28px; }
.prhead { display: grid; grid-template-columns: 330px 1fr 300px 320px; gap: 24px; padding: 0 32px 4px; font-size: 20px; color: var(--dim); font-weight: 700; }

/* ---------- 리뷰 카드 ---------- */
.rgrid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 26px; height: 100%; }
.rcard { padding: 28px 34px; display: flex; flex-direction: column; text-align: left; cursor: pointer; transition: transform .25s, border-color .25s; color: inherit; width: 100%; }
.rcard:hover { transform: translateY(-4px); border-color: rgba(143, 137, 255, .7); }
.rcard .top { display: flex; align-items: center; gap: 20px; }
.rcard .top .ava { width: 84px; height: 84px; }
.rcard .top .nm { font-size: 30px; font-weight: 800; }
.rcard .top .meta { font-size: 21px; color: var(--muted); margin-top: 2px; }
.rcard h3 { font-size: 27px; font-weight: 800; line-height: 1.35; margin-top: 18px; }
.rcard p { font-size: 23px; line-height: 1.5; color: var(--muted); margin-top: 10px; }
.rcard .more { margin-top: auto; font-size: 21px; font-weight: 700; color: var(--accent2); }

/* ---------- 회고 ---------- */
.retro { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; height: 100%; }
.rcol { padding: 26px 26px 22px; display: flex; flex-direction: column; }
.rcol .head2 { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
.rcol .ava { width: 82px; height: 82px; } .rcol .nm { font-size: 32px; font-weight: 800; }
.rcol h4 { font-size: 22px; font-weight: 800; margin: 10px 0 6px; display: flex; gap: 10px; align-items: center; }
.rcol p { font-size: 22px; line-height: 1.55; color: #dcdaf6; }
.rcol h4.g { color: var(--green); } .rcol h4.o { color: var(--orange); }

/* ---------- 마무리 ---------- */
.thanks { display: grid; grid-template-columns: 1fr 880px; gap: 24px; height: 100%; align-items: center; padding-top: 30px; }
.thanks h1 { font-size: 170px; font-weight: 900; line-height: 1; letter-spacing: -.03em; background: linear-gradient(100deg, #fff 20%, #b9b5ff 60%, #5eead4); -webkit-background-clip: text; background-clip: text; color: transparent; }
.thanks .lines { font-size: 40px; line-height: 1.5; color: var(--muted); margin-top: 22px; } .thanks .lines b { color: var(--gold); }
.thanks .who2 { display: flex; gap: 22px; margin-top: 36px; } .thanks .who2 .ava { width: 96px; height: 96px; border: 4px solid rgba(255,255,255,.9); }
.thanks .who2 div { text-align: center; font-size: 20px; color: var(--muted); } .thanks .who2 b { display: block; font-size: 22px; color: #fff; margin-top: 6px; }
.thanks .kpi { display: flex; gap: 18px; margin-top: 34px; }
.thanks .kpi div { padding: 14px 24px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); text-align: center; }
.thanks .kpi b { font-size: 44px; font-weight: 900; display: block; color: var(--accent2); font-variant-numeric: tabular-nums; } .thanks .kpi span { font-size: 20px; color: var(--muted); }
.thanks img.art { width: 880px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); animation: float 7s ease-in-out infinite; }

/* ====================== 엔진 ====================== */
const $ = (s, r = document) => r.querySelector(s);
const stage = $("#stage"), host = $("#slides");
const SECTIONS = [...new Set(SLIDES.map((s) => s.section))];

host.innerHTML = SLIDES.map((s, i) => `<section class="slide ${s.cls}" data-i="${i}" aria-label="${s.title}" aria-hidden="true">${s.html}</section>`).join("");
const els = [...host.children];
const N = els.length;
let idx = 0, step = 0, modalOpen = false;

function fit() {
	const s = Math.min(innerWidth / 1920, innerHeight / 1080);
	stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener("resize", fit); fit();

const fragsOf = (i) => [...els[i].querySelectorAll(".frag")];

function loadMedia(i) {
	[i - 1, i, i + 1].forEach((k) => {
		if (k < 0 || k >= N) return;
		els[k].querySelectorAll("img[data-src]").forEach((im) => { im.src = im.dataset.src; im.removeAttribute("data-src"); });
	});
}

function applySteps() {
	const f = fragsOf(idx), last = {};
	f.forEach((el, i) => { el.classList.toggle("shown", i < step); el.classList.remove("swapped"); if (el.dataset.swap && i < step) last[el.dataset.swap] = i; });
	f.forEach((el, i) => { if (el.dataset.swap && i < step && last[el.dataset.swap] !== i) { el.classList.remove("shown"); el.classList.add("swapped"); } });
	const cur = f[last.p]; // 문제 카드 점 표시
	els[idx].querySelectorAll("[data-dot]").forEach((d) => d.classList.toggle("on", !!cur && +d.dataset.dot === +cur.dataset.dotidx));
}

function countUp(root) {
	root.querySelectorAll(".count[data-to]").forEach((el) => {
		const to = parseFloat(el.dataset.to), dec = +(el.dataset.dec || 0);
		if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = to.toFixed(dec); return; }
		const t0 = performance.now(), dur = 1100;
		const tick = (t) => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = (to * e).toFixed(dec); if (p < 1) requestAnimationFrame(tick); };
		requestAnimationFrame(tick);
	});
}

function go(i, s = 0, silent = false) {
	i = Math.max(0, Math.min(N - 1, i));
	const changed = i !== idx || silent;
	idx = i; step = s;
	els.forEach((el, k) => { el.classList.toggle("active", k === i); el.classList.toggle("past", k < i); el.setAttribute("aria-hidden", k === i ? "false" : "true"); });
	loadMedia(i); applySteps();
	if (changed) countUp(els[i]);
	$("#count").textContent = `${String(i + 1).padStart(2, "0")} / ${N}`;
	$("#secName").textContent = SLIDES[i].section;
	$("#progress").style.width = `${(i / (N - 1)) * 100}%`;
	$("#btnPrev").disabled = i === 0; $("#btnNext").disabled = i === N - 1;
	if (location.hash !== `#${i + 1}`) history.replaceState(null, "", `${location.search}#${i + 1}`);
	renderToc();
}

function next() { const n = fragsOf(idx).length; if (step < n) { step++; applySteps(); } else if (idx < N - 1) go(idx + 1, 0); }
function prev() { if (step > 0) { step--; applySteps(); } else if (idx > 0) go(idx - 1, fragsOf(idx - 1).length); }
function showAll() { step = fragsOf(idx).length; applySteps(); }

/* ---- 오버레이 ---- */
const tocO = $("#tocOverlay"), modal = $("#modal"), sheet = $("#sheet");
function renderToc() {
	$("#toc").innerHTML = `<div class="toc-title">목차</div>` + SECTIONS.map((sec) => `<div><h3>${sec}</h3>${SLIDES.map((s, i) => s.section === sec ? `<button type="button" data-go="${i}" class="${i === idx ? "cur" : ""}"><i>${String(i + 1).padStart(2, "0")}</i>${s.title}</button>` : "").join("")}</div>`).join("");
}
function toggleToc(force) { const open = force ?? !tocO.classList.contains("open"); tocO.classList.toggle("open", open); }
tocO.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) { go(+b.dataset.go); toggleToc(false); } else if (e.target === tocO) toggleToc(false); });

function openSheet(html) { sheet.innerHTML = `<button type="button" class="x" aria-label="닫기 (Esc)">✕</button>${html}`; modal.classList.add("open"); modalOpen = true; sheet.scrollTop = 0; $(".x", sheet).focus(); }
function closeSheet() { modal.classList.remove("open"); modalOpen = false; }
modal.addEventListener("click", (e) => { if (e.target === modal || e.target.closest(".x")) closeSheet(); });

function openReview(i) {
	const r = REVIEWS[i];
	openSheet(`<div class="who3">${ring(r.who, 96)}<div><h2>${r.who}의 Best Practice · PR #${r.pr}</h2><div style="font-size:22px;color:var(--muted)">리뷰 @${r.reviewer} · <a href="${REPO}/pull/${r.pr}" target="_blank" rel="noopener" style="color:var(--accent2)">PR 보기 ↗</a></div></div></div>
		<p style="font-weight:700;color:#fff">${r.title}</p>
		<h5 class="p">문제 상황</h5><p>${r.problem}</p>
		<h5 class="f">적용한 방법</h5><p>${r.how}</p>
		<h5 class="g">좋았던 점</h5><p>${r.good}</p>`);
}

/* ---- 입력 ---- */
stage.addEventListener("click", (e) => {
	if (modalOpen || tocO.classList.contains("open")) return;
	const rc = e.target.closest("[data-review]"); if (rc) { openReview(+rc.dataset.review); return; }
	const z = e.target.closest("[data-zoom]"); if (z) { openSheet(`<img class="zoom" src="${z.dataset.zoom}" alt="${z.alt}">`); return; }
	if (e.target.closest("a, button, .chrome, .overlay")) return;
	const r = stage.getBoundingClientRect();
	(e.clientX - r.left < r.width * 0.12) ? prev() : next();
});
$("#btnPrev").onclick = prev; $("#btnNext").onclick = next; $("#btnToc").onclick = () => toggleToc();
$("#btnFs").onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };

addEventListener("keydown", (e) => {
	if (e.metaKey || e.ctrlKey || e.altKey) return;
	const k = e.key;
	if (k === "Escape") { if (modalOpen) closeSheet(); else toggleToc(false); return; }
	if (modalOpen) return;
	if (tocO.classList.contains("open")) { if (k === "t" || k === "T") toggleToc(false); return; }
	if (["ArrowRight", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); next(); }
	else if (["ArrowLeft", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); prev(); }
	else if (k === "Home") go(0); else if (k === "End") go(N - 1);
	else if (k === "t" || k === "T" || k === "m" || k === "M") toggleToc(true);
	else if (k === "f" || k === "F") $("#btnFs").click();
	else if (k === "a" || k === "A") showAll();
	else if (/^[1-4]$/.test(k) && els[idx].querySelector("[data-review]")) openReview(+k - 1);
});

let tx = null;
addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
addEventListener("touchend", (e) => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 60 && !modalOpen) (dx < 0 ? next() : prev()); }, { passive: true });

addEventListener("beforeprint", () => { els.forEach((_, i) => loadMedia(i)); document.querySelectorAll("img[data-src]").forEach((im) => { im.src = im.dataset.src; }); document.querySelectorAll('.count[data-to]').forEach((el) => { el.textContent = (+el.dataset.to).toFixed(+(el.dataset.dec || 0)); }); });

addEventListener("hashchange", () => { const k = (parseInt(location.hash.slice(1), 10) || 1) - 1; if (k !== idx && k >= 0 && k < N) go(k, 0); });

/* ---- 시작 ---- */
const start = Math.max(0, Math.min(N - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
go(start, 0, true);
if (new URLSearchParams(location.search).has("all")) showAll();
})();
</script>
</body>
</html>
