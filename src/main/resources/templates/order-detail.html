<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('주문 상세')}"></head>
<body>
<header th:replace="~{fragments :: header('orders')}"></header>
<main>
	<div class="page-head">
		<h1>주문 <span th:text="${'#' + order.id}">#1</span>
			<span th:class="'badge badge-' + ${order.status.name()}" th:text="${order.status.label}">확정</span></h1>
		<a class="button" th:href="@{/orders}">목록으로</a>
	</div>

	<p class="alert ok" th:if="${message}" th:text="${message}"></p>
	<p class="alert error" th:if="${error}" th:text="${error}"></p>

	<section class="card">
		<dl class="meta">
			<div><dt>확정 일시</dt><dd th:text="${#temporals.format(order.confirmedAt, 'yyyy-MM-dd HH:mm')}"></dd></div>
			<div><dt>작성자</dt><dd th:text="${order.createdBy}"></dd></div>
			<div><dt>경로</dt><dd th:text="${order.routeLabel}"></dd></div>
			<div><dt>메모</dt><dd th:text="${order.memo != null ? order.memo : '-'}"></dd></div>
		</dl>

		<div class="actions" th:if="${!order.status.next().isEmpty()}">
			<form th:each="s : ${order.status.next()}" th:action="@{/orders/{id}/status(id=${order.id})}" method="post"
			      th:data-confirm="${s.label + '(으)로 바꿉니다. 계속할까요?'}" class="status-form">
				<input type="hidden" name="status" th:value="${s.name()}">
				<input type="hidden" name="version" th:value="${order.version}">
				<button type="submit" th:class="${s.name() == 'CANCELED'} ? 'danger' : 'primary'"
				        th:text="${s.label + '(으)로 변경'}">진행</button>
			</form>
		</div>
		<p class="muted" th:if="${order.status.next().isEmpty()}">최종 상태라 더 바꿀 수 없습니다.</p>
	</section>

	<section class="card">
		<h2>상태 이력</h2>
		<table class="grid">
			<thead><tr><th>일시</th><th>이전 상태</th><th>새 상태</th><th>변경한 사람</th></tr></thead>
			<tbody>
			<tr th:each="h : ${history}">
				<td th:text="${#temporals.format(h.changedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
				<td th:text="${h.fromStatus != null ? h.fromStatus.label : '-'}"></td>
				<td th:text="${h.toStatus.label}"></td>
				<td th:text="${h.changedBy}"></td>
			</tr>
			</tbody>
		</table>
	</section>

	<div id="summary"></div>

	<section class="card">
		<h2>지도 애니메이션 (저장된 계획)</h2>
		<div id="anim"></div>
	</section>

	<section class="card" id="details"></section>
</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/anim.js}"></script>
<script th:src="@{/js/planview.js}"></script>
<script th:inline="javascript">
	const stored = JSON.parse(/*[[${order.planJson}]]*/ '{}');
	PlanView.renderSummary(document.getElementById('summary'), stored);
	PlanView.renderDetails(document.getElementById('details'), stored);
	BatteryAnim.mount(document.getElementById('anim'), stored, {autoplay: false});

	document.querySelectorAll('.status-form').forEach(f => f.addEventListener('submit', e => {
		if (!confirm(f.dataset.confirm)) e.preventDefault();
	}));
</script>
</body>
</html>
