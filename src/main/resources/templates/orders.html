<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('주문 목록')}"></head>
<body>
<header th:replace="~{fragments :: header('orders')}"></header>
<main>
	<div class="page-head">
		<h1>주문 목록</h1>
		<a class="button primary" th:href="@{/orders/new}">주문 추가</a>
	</div>

	<div class="filters">
		<a th:href="@{/orders}" class="chip" th:classappend="${status == null} ? 'active'">
			전체 <span class="count" th:text="${total}">0</span>
		</a>
		<a th:each="s : ${statuses}" th:href="@{/orders(status=${s})}" class="chip"
		   th:classappend="${status == s} ? 'active'">
			<span th:text="${s.label}">확정</span> <span class="count" th:text="${counts.get(s)}">0</span>
		</a>
	</div>

	<table class="grid">
		<thead>
		<tr>
			<th>주문번호</th><th>확정 일시</th><th class="num">총 수량(K)</th><th>경로</th>
			<th class="num">소요 일수</th><th class="num">총 비용(억원)</th><th>상태</th><th>작성자</th>
		</tr>
		</thead>
		<tbody>
		<tr th:each="o : ${orders}" class="clickable" th:onclick="|location.href='@{/orders/{id}(id=${o.id})}'|">
			<td><a th:href="@{/orders/{id}(id=${o.id})}" th:text="${'#' + o.id}">#1</a></td>
			<td th:text="${#temporals.format(o.confirmedAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</td>
			<td class="num" th:text="${#numbers.formatInteger(o.totalK, 1, 'COMMA')}">12,000</td>
			<td th:text="${o.routeLabel}">운항비 최소</td>
			<td class="num" th:text="${o.totalDays}">26</td>
			<td class="num" th:text="${o.totalCostEok}">98.00</td>
			<td><span th:class="'badge badge-' + ${o.status.name()}" th:text="${o.status.label}">확정</span></td>
			<td th:text="${o.createdBy}">admin</td>
		</tr>
		<tr th:if="${#lists.isEmpty(orders)}">
			<td colspan="8" class="empty">주문이 없습니다.</td>
		</tr>
		</tbody>
	</table>
</main>
</body>
</html>
