<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('마스터 데이터')}"></head>
<body>
<header th:replace="~{fragments :: header('master')}"></header>
<main>
	<div class="page-head"><h1>마스터 데이터</h1></div>
	<p class="muted">모든 사용자가 같은 값을 봅니다. 값을 바꿔도 이미 확정한 주문의 계획은 바뀌지 않습니다.</p>

	<p class="alert ok" th:if="${message}" th:text="${message}"></p>
	<div class="alert error" th:if="${errors}">
		<strong>저장하지 않았습니다. 아래 값을 확인하세요.</strong>
		<ul><li th:each="e : ${errors}" th:text="${e}"></li></ul>
	</div>

	<form th:action="@{/master}" method="post">
		<section class="card">
			<h2>공장</h2>
			<table class="grid">
				<thead><tr><th>나라</th><th>하루 최대 생산량(K)</th><th>재고 상한(K)</th><th>셀당 원가(원)</th></tr></thead>
				<tbody>
				<tr th:each="c : ${factories}">
					<td th:text="${c.label}">중국</td>
					<td><input type="number" min="1" th:name="${'maxDaily_' + c.name()}" th:value="${form['maxDaily_' + c.name()]}"></td>
					<td><input type="number" min="1" th:name="${'stockLimit_' + c.name()}" th:value="${form['stockLimit_' + c.name()]}"></td>
					<td><input type="number" min="1" th:name="${'unitCost_' + c.name()}" th:value="${form['unitCost_' + c.name()]}"></td>
				</tr>
				</tbody>
			</table>
		</section>

		<section class="card">
			<h2>선박</h2>
			<div class="row">
				<label>배 척수 (1~4)
					<input type="number" min="1" max="4" name="shipCount" th:value="${form['shipCount']}"></label>
				<label>척당 일 운항비(억 원)
					<input type="text" inputmode="decimal" name="shipDailyCost" th:value="${form['shipDailyCost']}"></label>
			</div>
		</section>

		<section class="card">
			<h2>항로 (항해 일수, 양방향 동일)</h2>
			<table class="grid matrix">
				<thead>
				<tr><th></th><th th:each="c, st : ${countries}" th:if="${st.index > 0}" th:text="${c.label}">중국</th></tr>
				</thead>
				<tbody>
				<tr th:each="a, ai : ${countries}" th:if="${ai.index < countries.length - 1}">
					<th th:text="${a.label}">한국</th>
					<td th:each="b, bi : ${countries}" th:if="${bi.index > 0}">
						<input type="number" min="1" th:if="${bi.index > ai.index}"
						       th:name="${'days_' + a.name() + '_' + b.name()}"
						       th:value="${form['days_' + a.name() + '_' + b.name()]}">
						<span th:unless="${bi.index > ai.index}" class="muted">-</span>
					</td>
				</tr>
				</tbody>
			</table>
		</section>

		<button type="submit" class="primary">저장</button>
	</form>
</main>
</body>
</html>
