<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' - 배터리 주문 관리'">배터리 주문 관리</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="header(active)" class="topbar">
	<a class="brand" th:href="@{/orders}">배터리 주문 관리</a>
	<nav>
		<a th:href="@{/orders}" th:classappend="${active == 'orders'} ? 'active'">주문 목록</a>
		<a th:href="@{/orders/new}" th:classappend="${active == 'new'} ? 'active'">주문 추가</a>
		<a th:href="@{/master}" th:classappend="${active == 'master'} ? 'active'">마스터 데이터</a>
	</nav>
	<div class="user">
		<span th:text="${loginUser}">admin</span>
		<form th:action="@{/logout}" method="post"><button type="submit" class="link">로그아웃</button></form>
	</div>
</header>
</body>
</html>
